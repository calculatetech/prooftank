schema_version: "1.0"

workflow:
  id: "proofmill-standard"
  name: "Proofmill Standard"
  version: "0.1.0"
  author: "Proofmill"
  description: "Runs the standard Spec Kit cycle with contract and evidence review gates."

requires:
  speckit_version: "==0.16.3.dev0"
  integrations:
    any:
      - "codex"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe the required behavior and scope boundary."
steps:
  - id: provider-preflight
    type: shell
    run: |
      provider_skills=.agents/skills
      test -f "$provider_skills/ponytail/SKILL.md" || {
        echo "unavailable: ponytail" >&2
        exit 1
      }
      test -f "$provider_skills/simple-english/SKILL.md" || {
        echo "unavailable: simple-english" >&2
        exit 1
      }
    timeout: 10

  - id: specify
    command: speckit.specify
    integration: "codex"
    input:
      args: "{{ inputs.spec }}"

  - id: review-contract
    type: gate
    message: "Review the scope boundary, invariants, failures, evidence, and unknowns."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "codex"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the bounded work packet before task generation."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "codex"

  - id: analyze
    command: speckit.analyze
    integration: "codex"

  - id: review-analysis
    type: gate
    message: "Review traceability and unresolved findings before implementation."
    options: [approve, reject]
    on_reject: abort

  - id: implement
    command: speckit.implement
    integration: "codex"

  - id: converge
    command: speckit.converge
    integration: "codex"

  - id: review-evidence
    type: gate
    message: "Accept only current deterministic evidence. Treat missing evidence as unknown."
    options: [approve, reject]
    on_reject: abort
